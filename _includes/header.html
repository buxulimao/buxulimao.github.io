<!-- ==========================================================
    ✟ GOTHIC LUXURY HANDHELD NAVIGATION HEADER (SELF-CONTAINED) ✟
    ========================================================== -->

<!-- 🌟 全局浏览器小图标：所有引入此组件的子网页都会自动生效 -->
<link rel="icon" href="{{ '/images/tougu.png' | relative_url }}" type="image/png">

<!-- 1. 结构层 (HTML) -->
<header id="header">
    <img class="logo-btn" 
         src="{{ '/images/logo.png' | relative_url }}" 
         alt="LOGO" 
         id="headerLogoBtn"
         onclick="window.location.href='{{ '/' | relative_url }}'">

    <div class="menu-trigger" id="menuTrigger" aria-label="Toggle Navigation">
        <div class="menu-trigger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <nav id="dropdown-menu">
        <div class="menu-links">
            <span class="menu-item" onclick="window.location.href='https://andseethingsasido.github.io/and666/'">商店</span>
            <span class="menu-item" onclick="openWeChatCard()">公众号</span>
        </div>
    </nav>
</header>

<!-- 独立弹窗组件：公众号遮罩层 -->
<div class="modal-overlay" id="qrcodeModal">
    <div class="modal-content">
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="gozhonghao" class="qrcode-img" id="modalQrcodeImg">
    </div>
</div>

<!-- 2. 样式层 (CSS) -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');

    /* 自动注入顶部防遮挡边距 */
    @media (max-width: 768px) {
        body { padding-top: 55px !important; }
    }
    @media (min-width: 769px) {
        body { padding-top: 80px !important; }
    }

    #header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: transparent;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        z-index: 1000010 !important;
        box-sizing: border-box;
        padding: 0 40px;
        pointer-events: none;
    }

    .logo-btn {
        width: auto;
        cursor: pointer;
        position: relative;
        z-index: 10003;
        transition: transform 0.3s, filter 0.3s; 
        pointer-events: auto;
    }
    .logo-btn:hover { transform: scale(1.05); }
    .logo-btn.active { filter: invert(1) !important; }

    .menu-trigger {
        position: absolute;
        right: 40px;
        top: 0;
        display: flex;
        align-items: center;
        z-index: 10002;
        cursor: pointer;
        pointer-events: auto;
    }
    
    .menu-trigger-icon { 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between;
    }
    .menu-trigger-icon span { 
        display: block; 
        width: 100%; 
        background: #fff; 
        transition: background 0.3s, transform 0.3s; 
    }
    
    .menu-trigger.active .menu-trigger-icon span { background: #000; }

    #dropdown-menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transform: translateY(-100%); 
        background: #ffffff; 
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        box-sizing: border-box;
        z-index: 10001;
        display: flex;
        justify-content: flex-end; 
        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #dropdown-menu.show { transform: translateY(0); }

    .menu-links { 
        display: flex; 
        flex-direction: column; 
        align-items: flex-end;
        text-align: right;
        gap: 24px; 
    }
    
    .menu-item {
        font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
        font-size: 20px; 
        font-weight: 700; 
        letter-spacing: 0.15em; 
        color: #000000; 
        cursor: pointer;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
        margin-right: -0.15em; 
    }
    .menu-item:hover { 
        opacity: 0.6; 
        transform: translateX(-5px);
    }

    /* 独立弹窗组件：公众号遮罩层 */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85); 
        backdrop-filter: blur(8px); 
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999 !important;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .modal-content {
        background-color: #ffffff; 
        border: 1px solid #000000; 
        padding: 35px 35px 45px 35px; 
        text-align: center;
        max-width: 320px;
        width: 90%;
        position: relative;
        transform: scale(0.96); 
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .modal-overlay.active .modal-content { transform: scale(1); }

    .modal-title {
        font-family: 'UnifrakturMaguntia', cursive;
        font-size: 28px;
        margin-bottom: 25px;
        color: #000000;
        letter-spacing: 0.05em;
    }

    .qrcode-img {
        width: 160px; 
        height: 160px;
        object-fit: contain;
        margin: 0 auto;
        display: block;
        filter: none !important; 
    }

    @media (max-width: 768px) {
        #header { height: 40px; padding: 0 20px; }
        .logo-btn { height: 20px; } 
        .menu-trigger { height: 40px; right: 20px; }
        .menu-trigger-icon { width: 18px; height: 10px; }
        .menu-trigger-icon span { height: 1.5px; }
        #dropdown-menu { padding: 70px 20px 40px; }
    }
    @media (min-width: 769px) {
        #header { height: 55px; }
        .logo-btn { height: 35px; } 
        .menu-trigger { height: 55px; }
        .menu-trigger-icon { width: 24px; height: 13px; } 
        .menu-trigger-icon span { height: 2px; }
        #dropdown-menu { padding: 90px 40px 45px; }
    }
</style>

<!-- 3. 行为层 (JavaScript) -->
<script>
    const trigger = document.getElementById('menuTrigger');
    const menu = document.getElementById('dropdown-menu');
    const logo = document.getElementById('headerLogoBtn');
    const modal = document.getElementById('qrcodeModal');

    let isHoveringTrigger = false;
    let isHoveringMenu = false;
    let isHoveringLogo = false;
    let isClickOpen = false;

    function openMenu() {
        if(menu) menu.classList.add('show');
        if(trigger) trigger.classList.add('active');
        if(logo) logo.classList.add('active');
    }

    function closeMenu() {
        if(menu) menu.classList.remove('show');
        isClickOpen = false;
        if (modal && !modal.classList.contains('active')) {
            if(trigger) trigger.classList.remove('active');
            if(logo) logo.classList.remove('active');
        }
    }

    function checkMenuStatus() {
        setTimeout(() => {
            if (!isHoveringTrigger && !isHoveringMenu && !isHoveringLogo && !isClickOpen) {
                closeMenu();
            }
        }, 30);
    }

    if (window.innerWidth >= 769) {
        if (trigger) {
            trigger.addEventListener('mouseenter', () => { isHoveringTrigger = true; openMenu(); });
            trigger.addEventListener('mouseleave', () => { isHoveringTrigger = false; checkMenuStatus(); });
        }
        if (menu) {
            menu.addEventListener('mouseenter', () => { isHoveringMenu = true; });
            menu.addEventListener('mouseleave', () => { isHoveringMenu = false; checkMenuStatus(); });
        }
        if (logo) {
            logo.addEventListener('mouseenter', () => { isHoveringLogo = true; if (menu && menu.classList.contains('show')) openMenu(); });
            logo.addEventListener('mouseleave', () => { isHoveringLogo = false; checkMenuStatus(); });
        }
    }

    if (trigger) {
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (menu && menu.classList.contains('show')) { closeMenu(); } else { isClickOpen = true; openMenu(); }
        });
    }

    window.addEventListener('scroll', () => { if (menu && menu.classList.contains('show')) closeMenu(); }, { passive: true });

    document.addEventListener('click', (e) => {
        if (menu && menu.classList.contains('show') && !menu.contains(e.target) && !trigger.contains(e.target)) { closeMenu(); }
    });

    function openWeChatCard() {
        closeMenu(); 
        if (modal) {
            modal.classList.add('active'); 
            if(trigger) trigger.classList.add('active');
            if(logo) logo.classList.add('active');
        }
    }

    function handleModalClose() {
        if (modal) {
            modal.classList.remove('active');
            if(trigger) trigger.classList.remove('active');
            if(logo) logo.classList.remove('active');
        }
    }

    if (modal) {
        modal.addEventListener('click', (e) => { if (e.target === modal) handleModalClose(); });
    }

    // 支持键盘 Esc 或掌机 B 键快捷关闭弹窗
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            handleModalClose();
            closeMenu();
        }
    });
</script>
