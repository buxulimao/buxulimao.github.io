<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 适配移动端视口 & 防止底部拉伸黑边 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>下载页面</title>
  <style>
    /* CSS 重置 & 消除移动端滚动与黑边 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* 使用 svh/dvh 动态适配移动端底部 Safe Area，防止出现黑边 */
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: #f5f5f7; /* 设置统一背景色，避免露底黑边 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* 页面主体内容 */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      /* 适配 iPhone 底部安全区域 */
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 1. 顶部 Logo：向右移动 5px */
    .header-logo {
      transform: translateX(5px);
      max-width: 120px;
      height: auto;
      display: block;
    }

    /* 遮罩层 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* 弹窗样式：初始位于顶部上方，通过 transition 实现 0.5s 滑下动画 */
    .modal-download {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 88%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 0 0 16px 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      text-align: center;
      z-index: 100;
      /* 滑下动画时长控制为 0.5 秒 */
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 弹窗滑下激活状态 */
    .modal-download.slide-down {
      transform: translate(-50%, 0);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      color: #666666;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Logo 偏移 5px -->
    <img src="logo.png" alt="Logo" class="header-logo">
  </div>

  <!-- 背景遮罩 -->
  <div class="overlay" id="overlay"></div>

  <!-- 无二维码弹窗 -->
  <div class="modal-download" id="downloadModal">
    <div class="modal-title">正在为你跳转商店...</div>
    <div class="modal-desc">请稍候，系统即刻完成加载</div>
  </div>

  <script>
    // 目标跳转链接
    const TARGET_URL = 'https://buxulimao.github.io/shop/'; 

    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('downloadModal');
      const overlay = document.getElementById('overlay');

      // 显示遮罩
      overlay.classList.add('active');
      
      // 触发下滑动画
      requestAnimationFrame(() => {
        modal.classList.add('slide-down');
      });

      // 0.5秒（500ms）下滑动画完成后自动跳转
      setTimeout(() => {
        window.location.href = TARGET_URL;
      }, 500);
    });
  </script>
</body>
</html>
