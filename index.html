<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console & Fur Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #060608;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 顶部固定导航栏与 Logo 按钮 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: blur(10px);
        }

        .logo-btn {
            height: 36px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .logo-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* 顶部下拉菜单抽屉 */
        .drawer-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            background-color: #0b0c10;
            overflow: hidden;
            transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #181920;
        }

        /* 抽屉内部元素 */
        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-top: 50px;
            opacity: 0;
            transition: opacity 0.3s ease 0.1s;
        }

        .drawer-menu.open {
            height: 380px;
        }

        .drawer-menu.open .menu-content {
            opacity: 1;
        }

        /* 商店按钮 */
        .shop-btn {
            display: inline-block;
            padding: 10px 32px;
            background: #101114;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #70758c;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        .shop-btn:hover {
            background: #70758c;
            color: #060608;
        }

        /* 公众号二维码结构 */
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-img {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            border: 1px solid #181920;
            object-fit: cover;
        }

        .qr-label {
            font-size: 12px;
            color: #70758c;
            letter-spacing: 1px;
        }

        /* 主界面容器与动画 */
        .console-wrapper {
            position: relative;
            margin-top: 60px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.menu-open .console-wrapper {
            transform: translateY(320px);
        }

        /* 掌机基础样式 */
        .console-container {
            position: relative;
            width: 800px;
            max-width: 95vw;
        }

        .console-bg {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* 屏幕 Canvas 容器 */
        .screen-area {
            position: absolute;
            top: 18%;
            left: 20%;
            width: 60%;
            height: 52%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. 顶部固定导航栏 -->
    <div class="top-bar">
        <img src="logo(2).png" alt="Menu Logo" class="logo-btn" id="menuToggleBtn">
    </div>

    <!-- 2. 下拉展开菜单 -->
    <div class="drawer-menu" id="drawerMenu">
        <div class="menu-content">
            <a href="https://buxulimao.github.io/shop/" target="_blank" class="shop-btn">商店</a>
            <div class="qr-container">
                <img src="gozhonghao.jpg" alt="公众号二维码" class="qr-img">
                <span class="qr-label">微信公众号</span>
            </div>
        </div>
    </div>

    <!-- 3. 主页面掌机容器 -->
    <div class="console-wrapper">
        <div class="console-container">
            <img src="gamebody.png" alt="Console Body" class="console-bg">
            <div class="screen-area">
                <canvas id="furCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- 4. 逻辑脚本 -->
    <script>
        // --- 菜单交互逻辑 ---
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const drawerMenu = document.getElementById('drawerMenu');

        menuToggleBtn.addEventListener('click', () => {
            const isOpen = drawerMenu.classList.toggle('open');
            document.body.classList.toggle('menu-open', isOpen);
            
            // 动画完成后重新计算 Canvas 尺寸
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 420);
        });

        // --- 皮毛 Canvas 模拟引擎 ---
        const canvas = document.getElementById('furCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 简易渲染循环示例（保留原有逻辑框架）
        function render() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 可以在此处编写你的皮毛渲染逻辑...
            
            requestAnimationFrame(render);
        }
        
        render();
    </script>
</body>
</html>
